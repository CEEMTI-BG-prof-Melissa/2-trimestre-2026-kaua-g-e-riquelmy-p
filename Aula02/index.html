<!DOCTYPE html>
<html lang="pt-br">
<head>
</head>
<body>
    <h1>PREFERÊNCIAS</h1>
    <form action="index.html" method="GET">
    <label for="nome"> nome: </label> 
    <input type="text" id="nome" name="nome">
    <p>Qual turno você prefere estudar?</p>
    <input type="radio" id="manha" name="manha"> 
    <label for="manha">Manhã</label> 
    <br>
    <input type="radio" id="tarde" name="tarde"> 
    <label for="tarde">Tarde</label>
    <br>
    <input type="radio" id="noite" name="noite"> 
    <label for="noite">Noite</label>
    <br>
    <p>Quais áreas da tecnologia você tem interesse?</p>
    <input type="checkbox" id="programaçao" name="programação"> 
    <label for="programaçao">Programação</label> 
    <br>
    <input type="checkbox" id="desing" name="desing"> 
    <label for="desing">Desing</label>
    <br>
    <input type="checkbox" id="Banco de Dados" name="Banco de Dados"> 
    <label for="Banco de Dados">Banco de Dados</label>
    <br>
    <input type="checkbox" id="Redes" name="Redes"> 
    <label for="Redes">Redes</label>
    <br>
    <p>Qual sua cor favorita? <input type="color"></p> <br>
    <p>Qual seu nível de satisfação? <input type="range"></p> <br>
    <p>Qual seu horário preferido <input type="time"></p> <br>
    <p>Envie um arquivo <input type="file"></p> <br>
    <input type="submit" value="Cadastrar"> <br>
    <input type="reset" value="Limpar"> <br>
  </form>
</body>
</html>
