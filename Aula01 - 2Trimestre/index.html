<!DOCTYPE HTML>
<html lang="pt-br">
<head>
  <title>Formulário HTML</title>
  <meta charset="UTF-8">
</head>

<body>
  <h1>Cadastro de Usuário</h1>
  <form action="cadastro.php" method="POST">
    <label for="nome">Nome: </label>
    <input type="text" id="nome">
    <br>
    <label for="email">E-mail: </label>
    <input type="email" id="email" name="email">
    <br>
    <label for="senha">Senha :</label>
    <input type="password" name="senha">
    <br>
    <label for="idade">idade: </label>
    <input type="number" id="idade" name="idade">
    <br>
    <label for="data">Data de nascimento: </label>
    <input type="date" id="nascimento">
    <br>
    <p>Turno:</p>
    <input type="radio" name="turno" id="manha"> <label for="manha">Manhä </label>
    <input type="radio" name="turma" id="tarde"> <label for="tarde">Tarde </label>
    <input type="radio" name="turno" id="noite"> <label for="noite">Noite </label>
    <br>
    <p>Areas de interesse:</p>
    <input type="checkbox" name="area" id="programacao"> <label for="programacao">Programação </label>
    <input type="checkbox" name="area" id="design"> <label for="design">Design </label>
    <input type="checkbox" name="area" id="redes"> <label for="redes">Redes </label>
    <br>
    <input type="submit" value="Enivar">
    <input type="reset" value="Limpar">
  </form>
</body>
</html>
